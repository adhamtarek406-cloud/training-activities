<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ترينينج تفاعلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap">
<style>
:root{--ink:#1C1F26;--ink2:#4B5263;--muted:#5F6675;--line:#D9DCE3;--soft:#EEEFF2;--bg:#FAFAF7;--card:#FFFFFF;--accent:#3B5BDB;--red:#B42318;--redbg:#FDECEA;--redink:#8A1C12;--green:#1E7F4F;--greenbg:#E6F4EC;--greenink:#14583A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,sans-serif}
button,input,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer}
.hidden{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--ink);color:#FAFAF7}
.top .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--accent);flex-shrink:0}
.top .meta{font-size:14px;color:#C5C9D2}
.phone{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.body{padding:24px 20px 40px;display:flex;flex-direction:column;gap:16px}
h1{margin:16px 0 0;font-size:30px;font-weight:800;line-height:1.3}
h2{margin:0;font-size:24px;font-weight:800;line-height:1.4}
h3{margin:4px 0 0;font-size:18px;font-weight:700}
p{margin:0;line-height:1.7;color:var(--ink2)}
.eyebrow{font-size:14px;font-weight:700;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
label{font-size:15px;font-weight:700}
input,textarea{border:2px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);width:100%;line-height:1.6}
input{height:52px}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:none}
.btn{height:56px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-size:18px;font-weight:700;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--ink);height:48px;font-size:16px}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chips.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.chip{height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:56px}
.circle{width:88px;height:88px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center}
.circle.ok{background:var(--accent)}
.scene{background:var(--ink);color:#FAFAF7;border-radius:16px;padding:20px;font-size:19px;font-weight:700;line-height:1.7}
.phase{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;border:2px solid}
.phase.red{border-color:var(--red);background:var(--redbg);color:var(--redink)}
.phase.green{border-color:var(--green);background:var(--greenbg);color:var(--greenink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.timer{min-width:56px;text-align:center;padding:4px 10px;border-radius:20px;font-size:15px;font-weight:800;background:var(--soft)}
.timer.low{background:var(--red);color:#fff}
.box{background:var(--soft);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.err{color:var(--red);font-weight:700;font-size:14px}
.quote{width:100%;background:var(--ink);color:#FAFAF7;border-radius:16px;padding:20px;font-size:18px;font-weight:700;line-height:1.7}

/* host */
.host{display:flex;min-height:100vh}
.side{width:340px;flex-shrink:0;background:var(--card);border-left:1px solid #E3E5EA;padding:22px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;max-height:100vh;position:sticky;top:0}
.main{flex:1;min-width:0;padding:26px 34px;display:flex;flex-direction:column;gap:18px}
.side input{height:44px;border-radius:10px;font-size:15px}
.sw{display:flex;gap:10px}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.on{border-color:var(--ink)}
.act{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:12px;border:2px solid #E3E5EA}
.act.view{border-color:var(--accent);background:#F4F5F8}
.act .st{font-size:13px;font-weight:700;color:var(--muted)}
.act .st.open{color:var(--greenink)}
.act button{height:40px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:700;border:2px solid var(--accent);background:var(--accent);color:#fff;flex-shrink:0}
.act button.close{border-color:var(--ink);background:#fff;color:var(--ink)}
.sep{height:1px;background:#E3E5EA}
.hd{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.codebox{background:var(--ink);color:#FAFAF7;border-radius:14px;padding:8px 18px;display:flex;flex-direction:column;align-items:center}
.codebox b{font-size:34px;letter-spacing:4px}
.qr{background:#fff;border-radius:12px;padding:6px;border:1px solid var(--line);width:110px;height:110px}
.qr img,.qr svg{width:100%;height:100%;display:block}
.panel{background:var(--card);border:1px solid #E3E5EA;border-radius:20px;padding:28px;flex:1;min-height:320px}
.cloud{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:12px 28px;min-height:280px}
.cloud span{font-weight:800;line-height:1.2}
.stat{background:var(--ink);color:#FAFAF7;border-radius:20px;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:220px;text-align:center}
.stat b{font-size:60px;color:var(--accent);line-height:1.1}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;flex:1}
.col{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;border:2px solid;max-height:60vh;overflow-y:auto}
.col.red{background:var(--redbg);border-color:var(--red)}
.col.green{background:var(--greenbg);border-color:var(--green)}
.col .card{background:#fff;border-radius:10px;padding:10px 14px;font-size:17px;line-height:1.6}
.bar{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.bar span:first-child{width:150px;flex-shrink:0;font-size:18px;font-weight:700}
.bar .track{flex:1;height:34px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:8px;transition:width .4s}
.bar b{width:40px;font-size:18px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.wall .card{background:#fff;border:1px solid #E3E5EA;border-top:6px solid var(--accent);border-radius:14px;padding:14px;font-size:17px;font-weight:600;line-height:1.6}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ctrl button{height:40px;padding:0 14px;border-radius:10px;border:2px solid var(--ink);background:#fff;font-weight:700;font-size:14px}
.ctrl button.on{background:var(--ink);color:#fff}
.empty{color:var(--muted);font-size:18px;text-align:center;padding:40px 0}
.projector .side{display:none}
@media (max-width:900px){.host{flex-direction:column}.side{width:auto;max-height:none;position:static;border-left:none;border-bottom:1px solid #E3E5EA}.main{padding:20px}.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>

async function openHost(){
  const { data } = await sb.from('eq_sessions').select('*').eq('code', H.code).maybeSingle();
  const { error } = await sb.rpc('eq_host_commitments', { p_code: H.code, p_pin: H.pin });
  if (!data || error) { store.set('eq_host', null); return renderHostLogin('الكود أو الـ PIN مش صح.'); }
  H.s = data; setAccent(data.accent); document.title = 'لوحة المدرب · ' + data.training_name;
  H.view = data.open_activity || 'checkin_start';
  await loadResponses(); await loadExtras();
  if (H.ch) sb.removeChannel(H.ch);
  H.ch = sb.channel('h-' + H.code)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'eq_responses', filter: 'session_code=eq.' + H.code }, (p) => { H.resp.push(p.new); renderMain(); })
    .subscribe();
  H.timers.forEach(clearInterval);
  H.timers = [setInterval(loadExtras, 5000), setInterval(loadResponses, 15000)];
  renderHost();
}
async function loadResponses(){
  const { data } = await sb.from('eq_responses').select('*').eq('session_code', H.code).order('id').limit(5000);
  if (data) { H.resp = data; if (H.mainEl) renderMain(); }
}
async function loadExtras(){
  const [c, k] = await Promise.all([
    sb.rpc('eq_participant_count', { p_code: H.code }),
    sb.rpc('eq_host_commitments', { p_code: H.code, p_pin: H.pin })
  ]);
  if (c.data != null) H.count = c.data;
  if (k.data) H.commits = k.data;
  if (H.countEl) H.countEl.textContent = H.count;
  if (H.view === 'commit' && H.mainEl) renderMain();
}

      h('div', { style: 'display:flex;flex-direction:column;gap:2px;align-items:flex-start' }, h('span', { class: 'small' }, 'ادخل من الموبايل على'), h('b', { dir: 'ltr', style: 'font-size:15px' }, location.host + location.pathname), h('span', { class: 'small' }, 'متصلين: ', H.countEl)),
      h('div', { class: 'codebox' }, h('span', { style: 'font-size:12px;color:#C5C9D2' }, 'كود الجلسة'), h('b', {}, H.code)),
      qrNode(joinUrl()),
      h('button', { class: 'btn ghost', style: 'width:auto;padding:0 16px', onclick: () => { document.body.classList.toggle('projector'); } }, 'وضع البروجيكتور'))
  );
  H.mainEl = h('div', { style: 'display:flex;flex-direction:column;gap:16px;flex:1' });
  mount(h('div', { class: 'host' }, side, h('div', { class: 'main' }, header, H.mainEl)));
  renderMain();
}
function bySession(act){ return H.resp.filter(r => r.activity === act); }
function renderMain(){
  const el = H.mainEl; if (!el) return; const v = H.view; const s = H.s;
  if (v === 'checkin_start' || v === 'checkin_end') {
    const rows = bySession(v);
    const counts = {}; let sum = 0;
    rows.forEach(r => { const w = String(r.data.word || '').trim(); if (w) counts[w] = (counts[w] || 0) + 1; sum += Number(r.data.level) || 0; });
    const max = Math.max(1, ...Object.values(counts));
    const words = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0, 40);
    const avg = rows.length ? (sum / rows.length).toFixed(1) : '—';
    const startRows = bySession('checkin_start');
    const startAvg = startRows.length ? (startRows.reduce((a,r) => a + (Number(r.data.level)||0), 0) / startRows.length).toFixed(1) : null;
    el.replaceChildren(h('div', { style: 'display:flex;gap:20px;flex-wrap:wrap;flex:1' },
      h('div', { class: 'panel' }, words.length ? h('div', { class: 'cloud' }, words.map(([w,n], i) => h('span', { style: 'font-size:' + Math.round(20 + 44 * n / max) + 'px;color:' + (i % 3 === 0 ? 'var(--accent)' : i % 3 === 1 ? 'var(--ink)' : 'var(--muted)') }, w))) : h('div', { class: 'empty' }, 'مستنيين أول إجابة...')),
      h('div', { class: 'stat' }, h('span', { style: 'color:#C5C9D2' }, 'متوسط الكلاس'), h('b', {}, avg), h('span', { style: 'color:#C5C9D2' }, 'من 10 · ' + rows.length + ' إجابة'),
        v === 'checkin_end' && startAvg ? h('span', { style: 'margin-top:10px;color:#C5C9D2' }, 'في البداية كان ' + startAvg) : null)
    ));
  } else if (v === 'react') {
    const sc = s.react_scene;
    const rows = bySession('react').filter(r => Number(r.data.scene) === sc);
    const red = rows.filter(r => r.data.phase === 'red'), green = rows.filter(r => r.data.phase === 'green');
    const ctrl = h('div', { class: 'ctrl' },
      h('span', { class: 'eyebrow' }, 'الموقف:'),
      [0,1,2,3].map(i => h('button', { class: sc === i ? 'on' : '', onclick: () => hostUpdate({ react_scene: i }) }, String(i + 1))),
      h('span', { class: 'eyebrow', style: 'margin-inline-start:12px' }, 'الجولة:'),
      h('button', { class: s.react_phase === 'red' ? 'on' : '', onclick: () => hostUpdate({ react_phase: 'red' }) }, 'أحمر'),
      h('button', { class: s.react_phase === 'green' ? 'on' : '', onclick: () => hostUpdate({ react_phase: 'green' }) }, 'أخضر'),
      h('span', { class: 'small' }, 'الموبايلات بتعرض الموقف والجولة اللي انت مختارهم.'));
    el.replaceChildren(ctrl, h('div', { class: 'scene' }, 'الموقف ' + (sc + 1) + ': ' + SCENES[sc]),
      h('div', { class: 'cols' },
        h('div', { class: 'col red' }, h('b', { style: 'color:var(--redink);font-size:18px' }, 'الأحمر · أول رد فعل (' + red.length + ')'), red.map(r => h('div', { class: 'card' }, r.data.text))),
        h('div', { class: 'col green' }, h('b', { style: 'color:var(--greenink);font-size:18px' }, 'الأخضر · بعد 10 ثواني تفكير (' + green.length + ')'), green.map(r => h('div', { class: 'card' }, r.data.text)))));
  } else if (v === 'path') {
    const rows = bySession('path');
    const p1 = rows.filter(r => r.data.phase === 1), p2 = rows.filter(r => r.data.phase === 2);
    const avgMist = p1.length ? (p1.reduce((a, r) => a + (Number(r.data.mistakes) || 0), 0) / p1.length).toFixed(1) : '—';
    const stat = (label, val) => h('div', { class: 'stat', style: 'min-width:180px;padding:16px' }, h('span', { style: 'color:#C5C9D2' }, label), h('b', { style: 'font-size:44px' }, val));
    el.replaceChildren(
      h('div', { style: 'display:flex;gap:16px;flex-wrap:wrap;align-items:stretch' },
        stat('رتّبوا المسار', p1.length), stat('متوسط الأخطاء', avgMist), stat('كتبوا المسار الواعي', p2.length),
        h('div', { style: 'display:flex;flex-direction:column;justify-content:center;gap:8px' },
          h('button', { class: 'btn ghost', style: 'width:auto;padding:0 18px', onclick: () => { H.showModel = !H.showModel; renderMain(); } }, H.showModel ? 'إخفاء المسار المقترح' : 'اعرض المسار المقترح'))),
      H.showModel ? h('div', { class: 'scene' }, 'مسار مقترح برد فعل واعٍ: ' + PATH_MODEL) : null,
      h('div', { class: 'box' }, h('b', {}, 'الموقف: ' + PATH_SCENE)),
      h('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px' },
        PATH_STEPS.map(st => h('div', { class: 'col green', style: 'max-height:50vh' },
          h('b', { style: 'color:var(--greenink);font-size:18px' }, st.label),
          p2.length ? p2.map(r => h('div', { class: 'card' }, r.data[st.key])) : h('span', { class: 'small' }, 'مستنيين...')))));
  } else if (v === 'buttons') {
    const items = []; bySession('buttons').forEach(r => (r.data.items || []).forEach(t => items.push(String(t))));
    const tally = {}; CATS.forEach(([c]) => tally[c] = 0); tally['أخرى'] = 0;
    items.forEach(t => { const hit = CATS.find(([, keys]) => keys.some(k => t.includes(k))); tally[hit ? hit[0] : 'أخرى']++; });
    const max = Math.max(1, ...Object.values(tally));
    el.replaceChildren(
      h('div', { class: 'panel', style: 'flex:none' }, Object.entries(tally).map(([c,n]) => h('div', { class: 'bar' }, h('span', {}, c), h('div', { class: 'track' }, h('div', { class: 'fill', style: 'width:' + Math.round(n / max * 100) + '%' })), h('b', {}, n)))),
      h('span', { class: 'small' }, 'التصنيف تلقائي بالكلمات، فممكن يغلط. الكروت كلها تحت.'),
      items.length ? h('div', { class: 'wall' }, items.map(t => h('div', { class: 'card' }, t))) : h('div', { class: 'empty' }, 'الصندوق لسه فاضي...'));
  } else if (v === 'commit') {
    el.replaceChildren(h('span', { class: 'eyebrow' }, H.commits.length + ' التزام · الأسماء والأرقام مش ظاهرة هنا، هتلاقيهم في ملف الـ CSV'),
      H.commits.length ? h('div', { class: 'wall' }, H.commits.map(c => h('div', { class: 'card' }, '«' + c.commitment + '»'))) : h('div', { class: 'empty' }, 'مستنيين أول التزام...'));
  }
}
function exportCsv(){
  const rows = [['الاسم','الالتزام','الواتساب','الوقت']].concat(H.commits.map(c => [c.name, c.commitment, c.phone, new Date(c.created_at).toLocaleString('ar-EG')]));
  const csv = '﻿' + rows.map(r => r.map(x => '"' + String(x ?? '').replace(/"/g,'""') + '"').join(',')).join('\n');
  const a = h('a', { href: URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })), download: 'commitments-' + H.code + '.csv' });
  document.body.append(a); a.click(); a.remove();
}

if (location.hash === '#host') startHost(); else startTrainee();
window.addEventListener('hashchange', () => location.reload());
})();
